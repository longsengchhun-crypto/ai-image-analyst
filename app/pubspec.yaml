name: ai_image_analyst
description: AI Image Understanding App — capture or upload a photo, get an AI description, detected objects, and ask visual questions about it.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0

  # Local persistence (history cache + settings)
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  # Image capture / processing
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  photo_view: ^0.15.0

  # UI polish
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  share_plus: ^13.3.0
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#0B1E3E"
  color_dark: "#0B1E3E"
  android_12:
    color: "#0B1E3E"
  # To use a custom logo instead of a solid color, drop a PNG at
  # assets/images/splash_icon.png and add `image: assets/images/splash_icon.png` here.
